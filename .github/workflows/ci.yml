name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      # 虚拟网卡只有 root 能建。单独跑一次，验证"设备能建、地址能配、路由能下发"，
      # 这部分编译通过说明不了任何问题。没有 /dev/net/tun 的机器直接跳过。
      - name: TUN（需要 root）
        if: runner.os == 'Linux'
        run: |
          if [ ! -e /dev/net/tun ]; then
            echo "没有 /dev/net/tun，跳过"
            exit 0
          fi
          # 先以普通用户编译，再 sudo 跑测试二进制：
          # sudo 会丢掉 RUSTUP_TOOLCHAIN，直接 sudo cargo 会报"没有默认工具链"
          cargo test -p qp2p-core --test tun_linux --no-run
          BIN=$(ls -t target/debug/deps/tun_linux-* | grep -v '\.d$' | head -1)
          echo "跑 $BIN"
          sudo "$BIN" --ignored --nocapture

  signal:
    name: signal (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 内存后端 + 内置 SQLite 冒充 D1，两条存储路径一起验
      - name: Smoke test
        run: node signal/smoke.mjs

      # NetworkRoom（DO）骨架：用 node:sqlite 冒充 storage.sql，验证建表/上下文/sweep
      - name: NetworkRoom smoke
        run: node signal/room-smoke.mjs

      # WebSocket：握手验签、hello、抢占旧连接、connect/resume/leave、限流、关闭码
      - name: WebSocket smoke
        run: node signal/ws-smoke.mjs

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: qp2p-linux-x86_64
            bin: qp2p
          # 静态链接：gnu 版是在 Ubuntu 24.04 上编的，要求 glibc >= 2.39，
          # 老发行版（Debian 12 / Ubuntu 22.04）直接跑不起来。musl 版没有这个限制。
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: qp2p-linux-x86_64-static
            bin: qp2p
          # ARM64 路由器（OpenWrt 的 aarch64_cortex-a53 一类）用的，同样是静态 musl。
          # musl-tools 只带 x86_64，aarch64 的编译器从 musl.cc 取。
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: qp2p-linux-aarch64-static
            bin: qp2p
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: qp2p-windows-x86_64
            bin: qp2p.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 安装 musl 工具链
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      # musl-tools 只有 x86_64 的 musl-gcc，aarch64 得自己准备交叉工具链。
      # 试过 musl.cc 的预编译包，runner 上连不上（connect 超时 130s+），换成 zig cc：
      # zig 自带 aarch64 musl 的 libc 和 crt，一条命令就能静态链接，不依赖第三方镜像。
      - name: 安装 aarch64 musl 工具链（zig cc）
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          set -euo pipefail
          ZIG_VER=0.13.0
          curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" \
            -o /tmp/zig.tar.xz
          sudo tar -xJf /tmp/zig.tar.xz -C /opt
          sudo ln -sf "/opt/zig-linux-x86_64-${ZIG_VER}/zig" /usr/local/bin/zig

          # cargo 的 linker 只能是一个可执行文件、不能带参数，所以包一层。
          # cc-rs 还会往编译器里塞 rust 三元组 --target=aarch64-unknown-linux-musl，
          # zig 不认这个写法（它要 aarch64-linux-musl），在这里换掉。
          sudo tee /usr/local/bin/zigcc >/dev/null <<'WRAP'
          #!/bin/sh
          n=$#
          i=0
          while [ "$i" -lt "$n" ]; do
            a=$1; shift
            i=$((i + 1))
            case "$a" in
              --target=aarch64-unknown-linux-musl) continue ;;
              aarch64-unknown-linux-musl)         continue ;;
              # rustc 给 aarch64-linux 加的这个 relax 选项 zig 的驱动不认，去掉
              -Wl,--fix-cortex-a53-843419)        continue ;;
            esac
            set -- "$@" "$a"
          done
          exec zig cc -target aarch64-linux-musl "$@"
          WRAP
          sudo chmod +x /usr/local/bin/zigcc

          {
            echo "CC_aarch64_unknown_linux_musl=zigcc"
            echo "AR_aarch64_unknown_linux_musl=ar"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=zigcc"
            # 不用 rust 自带的 musl crt/libc，交给 zig 提供的那份，否则两套 crt 会撞
            echo "RUSTFLAGS=-C link-self-contained=no"
          } >> "$GITHUB_ENV"

          zig version
          zigcc --version | head -n1
          file "$(command -v zigcc)"

      - name: Build release
        env:
          # 只有 musl 目标需要；其它目标忽略
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} -p qp2p-cli

      # WinTun 是运行期加载的 dll，不打包进去用户就得自己找，
      # 版本对不上还会报看不懂的错。这里直接连 dll 一起放进产物目录。
      - name: 准备 Windows 运行包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun -Force
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/qp2p.exe" dist/
          # 压缩包内部的层级可能随版本变，按名字找而不是写死路径
          $dll = Get-ChildItem -Path wintun -Recurse -Filter 'wintun.dll' |
            Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          if (-not $dll) { throw '压缩包里没找到 amd64 的 wintun.dll' }
          Copy-Item $dll.FullName dist/
          Copy-Item USAGE.md dist/
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && 'dist' || format('target/{0}/release/qp2p', matrix.target) }}
          if-no-files-found: error

  # Android 只能在这一步编出来：交叉编译要 NDK，打 APK 要 SDK + Gradle，
  # 两边都装一次比在本地凑环境省事得多。
  android:
    name: android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: 安装 NDK
        run: |
          echo "y" | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: 交叉编译 .so（arm64 + armv7 + x86_64 模拟器）
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o android/app/src/main/jniLibs build --release -p qp2p-android
          find android/app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 打 APK
        working-directory: android
        env:
          # AGP 默认往 ~/.config/.android 写 debug keystore，runner 上不可写。
          # 注意这两个值必须自洽（USER_HOME == SDK_HOME/.android），
          # 否则 AGP 会报 "different paths to the Android Preferences folder"。
          ANDROID_SDK_HOME: ${{ runner.temp }}
          ANDROID_USER_HOME: ${{ runner.temp }}/.android
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: qp2p-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 每次 push 都发布：打 v* 标签发正式版，推到 main 发预发布（v<版本>+<构建号>）。
  # 包全部来自本次运行刚编出来的产物，不从别处下载、不在本地上传。
  release:
    name: release
    if: github.event_name == 'push'
    needs: [test, signal, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # --generate-notes 要读提交历史来生成 release notes
          fetch-depth: 0

      # 版本号只认 Cargo.toml，tag 里的构建号不参与资产命名，
      # 否则 qp2p-0.1.2+57-linux-aarch64-static 这种名字在 OpenWrt 包里很难对上。
      - name: 决定版本与标签
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::读不到 Cargo.toml 里的 version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          case "$GITHUB_REF" in
            refs/tags/v*)
              echo "tag=$GITHUB_REF_NAME"                 >> "$GITHUB_OUTPUT"
              echo "prerelease=false"                     >> "$GITHUB_OUTPUT"
              echo "title=qp2p ${GITHUB_REF_NAME#v}"      >> "$GITHUB_OUTPUT"
              ;;
            *)
              # run_number 单调递增，天然唯一，不用自己算 sha 前缀
              echo "tag=v${VERSION}+${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "prerelease=true"                      >> "$GITHUB_OUTPUT"
              echo "title=qp2p ${VERSION} build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: 下载本次构建的全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: qp2p-*

      - name: 整理成发布文件
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p dist
          cp "artifacts/qp2p-windows-x86_64/qp2p.exe"  "dist/qp2p-${VERSION}-windows-x86_64.exe"
          cp "artifacts/qp2p-linux-x86_64/qp2p"        "dist/qp2p-${VERSION}-linux-x86_64"
          cp "artifacts/qp2p-linux-x86_64-static/qp2p" "dist/qp2p-${VERSION}-linux-x86_64-static"
          cp "artifacts/qp2p-linux-aarch64-static/qp2p" "dist/qp2p-${VERSION}-linux-aarch64-static"
          APK=$(find artifacts/qp2p-android-apk -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::Android 产物里没找到 apk"
            exit 1
          fi
          cp "$APK" "dist/qp2p-${VERSION}-android.apk"
          chmod +x "dist/qp2p-${VERSION}-linux-x86_64" "dist/qp2p-${VERSION}-linux-x86_64-static" \
                   "dist/qp2p-${VERSION}-linux-aarch64-static"

          (cd dist && sha256sum qp2p-* > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      # 重跑时 Release 可能已经存在（tag 构建号相同），这时只覆盖附件。
      - name: 创建 Release 并上传
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在，覆盖附件"
            gh release upload "$TAG" dist/* --clobber
          else
            NOTES=".github/release-notes/${TAG}.md"
            if [ "$PRE" = "true" ]; then
              # 自动构建没有手写说明，用提交记录生成
              gh release create "$TAG" \
                --title "$TITLE" \
                --target "$GITHUB_SHA" \
                --prerelease \
                --generate-notes \
                dist/*
            else
              if [ ! -f "$NOTES" ]; then
                echo "::error::缺少 $NOTES，发版前请先写好发布说明"
                exit 1
              fi
              gh release create "$TAG" \
                --title "$TITLE" \
                --notes-file "$NOTES" \
                --verify-tag \
                dist/*
            fi
          fi
          gh release view "$TAG" --json url,tagName,assets --jq \
            '"发布页: " + .url, "资产: " + ([.assets[].name] | join(", "))'
