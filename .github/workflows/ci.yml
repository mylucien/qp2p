name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      # 虚拟网卡只有 root 能建。单独跑一次，验证"设备能建、地址能配、路由能下发"，
      # 这部分编译通过说明不了任何问题。没有 /dev/net/tun 的机器直接跳过。
      - name: TUN（需要 root）
        if: runner.os == 'Linux'
        run: |
          if [ ! -e /dev/net/tun ]; then
            echo "没有 /dev/net/tun，跳过"
            exit 0
          fi
          sudo -E env "PATH=$PATH" cargo test -p qp2p-core --test tun_linux -- --ignored --nocapture

  signal:
    name: signal (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 内存后端 + 内置 SQLite 冒充 D1，两条存储路径一起验
      - name: Smoke test
        run: node signal/smoke.mjs

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: qp2p-linux-x86_64
            bin: qp2p
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: qp2p-windows-x86_64
            bin: qp2p.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p qp2p-cli

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error
