name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      # 虚拟网卡只有 root 能建。单独跑一次，验证"设备能建、地址能配、路由能下发"，
      # 这部分编译通过说明不了任何问题。没有 /dev/net/tun 的机器直接跳过。
      - name: TUN（需要 root）
        if: runner.os == 'Linux'
        run: |
          if [ ! -e /dev/net/tun ]; then
            echo "没有 /dev/net/tun，跳过"
            exit 0
          fi
          # 先以普通用户编译，再 sudo 跑测试二进制：
          # sudo 会丢掉 RUSTUP_TOOLCHAIN，直接 sudo cargo 会报"没有默认工具链"
          cargo test -p qp2p-core --test tun_linux --no-run
          BIN=$(ls -t target/debug/deps/tun_linux-* | grep -v '\.d$' | head -1)
          echo "跑 $BIN"
          sudo "$BIN" --ignored --nocapture

  signal:
    name: signal (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 内存后端 + 内置 SQLite 冒充 D1，两条存储路径一起验
      - name: Smoke test
        run: node signal/smoke.mjs

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: qp2p-linux-x86_64
            bin: qp2p
          # 静态链接：gnu 版是在 Ubuntu 24.04 上编的，要求 glibc >= 2.39，
          # 老发行版（Debian 12 / Ubuntu 22.04）直接跑不起来。musl 版没有这个限制。
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: qp2p-linux-x86_64-static
            bin: qp2p
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: qp2p-windows-x86_64
            bin: qp2p.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 安装 musl 工具链
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Build release
        env:
          # 只有 musl 目标需要；其它目标忽略
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} -p qp2p-cli

      # WinTun 是运行期加载的 dll，不打包进去用户就得自己找，
      # 版本对不上还会报看不懂的错。这里直接连 dll 一起放进产物目录。
      - name: 准备 Windows 运行包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun -Force
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/qp2p.exe" dist/
          Copy-Item "wintun/bin/amd64/wintun.dll" dist/
          Copy-Item USAGE.md dist/
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && 'dist' || format('target/{0}/release/qp2p', matrix.target) }}
          if-no-files-found: error
