<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>qp2p 配置</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--card:#fff;--fg:#15181d;--muted:#6b7280;--line:#e4e7ec;--accent:#2563eb;--ok:#16a34a;--warn:#b45309;--danger:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--fg:#e6e8eb;--muted:#9aa3ad;--line:#262b33;--accent:#5b8cff;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:22px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
h1{font-size:17px;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}.dot.bad{background:var(--danger)}.dot.warn{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
input:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>div{flex:1;min-width:140px}
button{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger);border-color:var(--danger)}
button:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted);font-size:12px}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;max-height:240px;overflow:auto;margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
.banner{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--card));padding:9px 11px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.hide{display:none}
.msg{font-size:12px;color:var(--muted);margin-left:4px}
.msg.err{color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>qp2p</h1>
    <span class="pill" id="pill"><span class="dot" id="dot"></span><span id="statusText">未连接</span></span>
    <span style="flex:1"></span>
    <button class="sm" id="quit">退出</button>
  </header>

  <div id="banner" class="banner hide"></div>

  <section class="card">
    <label>信令地址（Worker）</label>
    <input id="worker" placeholder="https://qp2p.example.com" spellcheck="false">
    <label>加入令牌</label>
    <input id="token" placeholder="qp2p1_home_xxxxxxxx" spellcheck="false">
    <label>本机名称</label>
    <input id="name" placeholder="pc">
    <div class="row" style="margin-top:2px">
      <div>
        <label>虚拟 IP（可留空，自动分配）</label>
        <input id="ip" placeholder="10.78.0.50" spellcheck="false">
      </div>
      <div>
        <label>MTU</label>
        <input id="mtu" placeholder="1400" inputmode="numeric">
      </div>
      <div>
        <label>空闲断开（秒，0 = 不断）</label>
        <input id="idle" placeholder="0" inputmode="numeric">
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="connect">连接</button>
      <button id="save">仅保存</button>
      <button class="danger" id="disconnect">断开</button>
      <button id="openDir">打开数据目录</button>
      <span class="msg" id="msg"></span>
    </div>
    <p class="muted" style="margin-bottom:0">关闭这个页面不会断开连接，程序常驻任务栏右下角；右键托盘图标可以连接/断开/退出。</p>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <b style="font-size:13px">已建立的直连</b>
      <span class="muted" id="linkCount"></span>
    </div>
    <table><thead><tr><th>对端</th><th>虚拟地址</th><th>延迟</th></tr></thead><tbody id="links"></tbody></table>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <b style="font-size:13px">运行日志</b>
      <span class="muted">最新 600 行</span>
    </div>
    <pre id="log">（还没有日志）</pre>
  </section>
</div>
<script>
var fields = ["worker","token","name","ip","mtu","idle"];
function $(id){return document.getElementById(id)}
function api(path, body){
  return fetch(path, body === undefined ? {credentials:'same-origin'} : {
    method:'POST', credentials:'same-origin',
    headers:{'content-type':'application/json'}, body:JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}
function values(){
  var out = {};
  fields.forEach(function(k){ out[k] = $(k).value.trim(); });
  out.mtu = Number(out.mtu || 1400);
  out.idle = Number(out.idle || 0);
  return out;
}
function setMsg(text, isErr){
  var el = $('msg'); el.textContent = text || ''; el.className = 'msg' + (isErr ? ' err' : '');
  if (text) setTimeout(function(){ if (el.textContent === text) { el.textContent=''; } }, 4000);
}
function render(state){
  if (!state) return;
  var c = state.config || {};
  fields.forEach(function(k){
    if (document.activeElement !== $(k) && c[k] !== undefined) $(k).value = c[k];
  });
  $('statusText').textContent = state.status || '未连接';
  var dot = $('dot');
  dot.className = 'dot';
  if (/已连接/.test(state.status || '')) dot.className = 'dot on';
  else if (/失效|异常|退出/.test(state.status || '')) dot.className = 'dot bad';
  else if (/仅打洞/.test(state.status || '')) dot.className = 'dot warn';

  var banner = $('banner');
  if (state.warn) { banner.textContent = '⚠ ' + state.warn; banner.classList.remove('hide'); }
  else banner.classList.add('hide');

  var links = state.links || [];
  $('linkCount').textContent = links.length ? (links.length + ' 条') : '暂无';
  var t = $('links'); t.innerHTML = '';
  if (!links.length) t.innerHTML = '<tr><td colspan="3" class="muted">还没有直连</td></tr>';
  links.forEach(function(l){
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>' + esc(l.name) + '</td><td>' + esc(l.ip) + '</td><td>' + esc(l.rtt) + '</td>';
    t.appendChild(tr);
  });

  var log = state.log || [];
  var pre = $('log');
  var atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
  pre.textContent = log.length ? log.join('\n') : '（还没有日志）';
  if (atBottom) pre.scrollTop = pre.scrollHeight;
  $('connect').disabled = !!state.running;
  $('disconnect').disabled = !state.running;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function poll(){ api('/api/state').then(render).catch(function(){}); }
setInterval(poll, 1200); poll();

$('save').onclick = function(){
  api('/api/config', values()).then(function(j){
    setMsg(j.ok ? '已保存' : j.error, !j.ok); render(j.state);
  });
};
$('connect').onclick = function(){
  api('/api/connect', values()).then(function(j){
    setMsg(j.ok ? '正在连接…' : j.error, !j.ok); render(j.state);
  });
};
$('disconnect').onclick = function(){
  api('/api/disconnect', {}).then(function(j){ setMsg(j.ok ? '已断开' : j.error, !j.ok); render(j.state); });
};
$('openDir').onclick = function(){ api('/api/open-dir', {}); };
$('quit').onclick = function(){
  if (!confirm('退出会断开当前连接，确定吗？')) return;
  api('/api/quit', {}).finally(function(){ document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#888">已退出，可以关闭这个标签页</div>'; });
};
</script>
</body>
</html>
