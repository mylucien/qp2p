name = "qp2p-signal"
main = "src/index.js"
compatibility_date = "2024-09-23"

# 部署前替换为 `wrangler d1 create qp2p-signal` 返回的 id
[[d1_databases]]
binding = "DB"
database_name = "qp2p-signal"
database_id = "<your-d1-id>"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "NetworkRoom"

# Durable Object 免费额度要求 SQLite 后端
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NetworkRoom"]

[vars]
# 仅用于创建网络；不要提交真实值，用 `wrangler secret put ADMIN_SECRET`
ADMIN_SECRET = "change-me"
